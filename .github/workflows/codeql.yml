name: "CodeQL"

on:
  push:
    branches: [ "main", "*"]
    tags: ['*']
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  schedule:
    - cron: '17 10 * * 2'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: "ubuntu-latest"
    timeout-minutes: 360
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
        - language: actions
    steps:
    - uses: mongodb-labs/drivers-github-tools/codeql@93fbe45aa64cf4d57ea3198423eb0e46e8cd402d  # v3.1.2
      with:
        language: ${{ matrix.language }}
        ref: ${{ inputs.ref }}
        config: |
          paths-ignore:
            - 'tests/**'
