name: Generate SBOM

# This workflow uses cyclonedx-py and publishes an sbom.json artifact.
# It runs on manual trigger or when package files change on main branch,
# and creates a PR with the updated SBOM.
# Internal documentation: go/sbom-scope

on:
  workflow_dispatch: {}
  push:
    branches: ['main']
    paths:
      - 'pyproject.toml'
      - 'requirements/sbom.txt'

permissions:
  contents: write
  pull-requests: write

jobs:
  sbom:
    name: Generate SBOM and Create PR
    runs-on: ubuntu-latest
    concurrency:
      group: sbom-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Generate SBOM
        run: |
          # Install the pinned runtime dependencies, then the package itself
          # without re-resolving them, so repeated runs produce identical SBOMs.
          # Regenerate requirements/sbom.txt when pyproject.toml's dependencies
          # change (dependabot also keeps it up to date):
          #   uv pip compile pyproject.toml --python-version 3.11 --no-annotate \
          #     --output-file requirements/sbom.txt
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements/sbom.txt
          pip install --no-deps .
          pip check
          pip uninstall -y pip setuptools
          deactivate
          python -m venv .venv-sbom
          source .venv-sbom/bin/activate
          pip install cyclonedx-bom==7.2.1
          cyclonedx-py environment --spec-version 1.5 --output-format JSON --output-file sbom.json .venv
          # Add PURL for fastapi-pymongo (local package doesn't get PURL automatically)
          jq '(.components[] | select(.name == "fastapi-pymongo" and .purl == null)) |= (. + {purl: ("pkg:pypi/fastapi-pymongo@" + .version)})' sbom.json > sbom.tmp.json && mv sbom.tmp.json sbom.json

      - name: Download CycloneDX CLI
        run: |
          curl -L -s -o /tmp/cyclonedx "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.29.1/cyclonedx-linux-x64"
          chmod +x /tmp/cyclonedx

      - name: Validate SBOM
        run: /tmp/cyclonedx validate --input-file sbom.json --fail-on-errors

      - name: Cleanup
        if: always()
        run: rm -rf .venv .venv-sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update SBOM after dependency changes'
          branch: auto-update-sbom-${{ github.run_id }}
          delete-branch: true
          title: 'Automation: Update SBOM'
          body: |
            ## Automated SBOM Update

            This PR was automatically generated because dependency manifest files changed.

            ### Changes
            - Updated `sbom.json` to reflect current dependencies

            ### Verification
            The SBOM was generated using cyclonedx-py v7.2.1 with the current Python environment.

            ### Triggered by
            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_id }}

            ---
            _This PR was created automatically by the [SBOM workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
